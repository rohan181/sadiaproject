services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      WRANGLER_LOG_PATH: .wrangler/wrangler.log

  postgis:
    image: pgrouting/pgrouting:16-3.4-3.6.1
    environment:
      POSTGRES_DB: accessbd
      POSTGRES_USER: accessbd
      POSTGRES_PASSWORD: accessbd_local
    ports:
      - "5432:5432"
    volumes:
      - accessbd_pg:/var/lib/postgresql/data
      - ./pipeline/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessbd -d accessbd"]
      interval: 5s
      timeout: 5s
      retries: 12

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    profiles: ["valhalla"]
    ports:
      - "8002:8002"
    volumes:
      - ./pipeline/data/osm:/custom_files
    environment:
      tile_urls: https://download.geofabrik.de/asia/bangladesh-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"

volumes:
  accessbd_pg:
